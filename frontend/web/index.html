<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit – Sichere Landung</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS: damit Safari die App wie eine native App öffnet -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Theme-Farbe für die Browser-Titelleiste (Android/Desktop) -->
<meta name="theme-color" content="#1e293b">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>✈ Cockpit <span class="subtitle">Sichere Landung</span></h1>

    <div id="spiel-auswahl">
      <label for="flughafen-auswahl">Flughafen:</label>

      <select id="flughafen-auswahl">
        <option value="MUC">MUC – München</option>
      </select>

      <button id="neues-spiel-btn">Neues Spiel</button>

      <a href="multiplayer.html" class="multiplayer-link">
        📡 Multiplayer
      </a>
    </div>
  </header>


  <!-- ========== Startmenü ========== -->
  <div id="start-menu">
    <div class="start-menu-inhalt">

      <div class="start-logo">
        <div class="start-flugzeug">✈</div>
        <h1>Cockpit</h1>
        <p>Digitaler Zwilling</p>
      </div>

      <div class="start-buttons">

        <button
          onclick="document.getElementById('start-menu').style.display='none';startPassAndPlay()"
          class="start-button pass-play-button">
          👥 Pass &amp; Play<br>
          <span>Zwei Spieler, ein Gerät</span>
        </button>

        <button
          onclick="window.location='multiplayer.html'"
          class="start-button multiplayer-button">
          📱 Multiplayer<br>
          <span>Zwei Geräte, kein Server nötig</span>
        </button>

      </div>
    </div>
  </div>


  <main id="spiel-ui" class="versteckt">

    <!-- =========================================================
         SPIELSTATUS
         ========================================================= -->

    <section id="status-leiste">

      <div class="status-feld">
        <span class="label">Runde</span>
        <span id="s-runde">-</span>
      </div>

      <div class="status-feld status-ressource">
        <span class="label">Aerodynamik</span>
        <span id="s-aero">-</span>
      </div>

      <div class="status-feld status-ressource">
        <span class="label">Bremsen-Marker</span>
        <span id="s-brems">-</span>
      </div>

      <div class="status-feld">
        <span class="label">Fluglage</span>
        <span id="s-fluglage">-</span>
      </div>

      <div class="status-feld">
        <span class="label">Kaffee</span>
        <span id="s-kaffee">-</span>
      </div>

      <div class="status-feld">
        <span class="label">Neuwurf</span>
        <span id="s-neuwurf">-</span>
      </div>

      <!--
        Die alten Werte bleiben erhalten, damit app.js
        weiterhin #s-hoehe und #s-entfernung aktualisieren kann.
        Sie werden nur nicht mehr prominent angezeigt.
      -->
      <span id="s-hoehe" class="status-wert-versteckt">-</span>
      <span id="s-entfernung" class="status-wert-versteckt">-</span>

    </section>


    <!-- =========================================================
         FLUG-/LANDUNGSBALKEN
         ========================================================= -->

    <section id="flugbahnen">

      <!-- Entfernung -->
      <div class="flugbahn-container">

        <div class="flugbahn-titel">
          <span>Entfernung</span>
          <span class="flugbahn-einheit">km</span>
        </div>

        <div id="entfernungs-balken" class="flugbahn">

          <!--
            Platzhalter-Tiles.
            Später können diese durch app.js dynamisch erzeugt werden.
          -->

          <div class="flug-tile">6</div>
          <div class="flug-tile">5</div>
          <div class="flug-tile">4</div>
          <div class="flug-tile">3</div>
          <div class="flug-tile">2</div>
          <div class="flug-tile">1</div>

          <div class="landungs-tile">
            <span>🛬</span>
          </div>

          <!--
            Bestehende JS-Ausgabe der Flugzeuge.
            app.js schreibt weiterhin in #s-flugzeuge.
          -->
          <div id="s-flugzeuge" class="flugzeuge-auf-balken"></div>

        </div>

      </div>


      <!-- Höhe -->
      <div class="flugbahn-container">

        <div class="flugbahn-titel">
          <span>Höhe</span>
          <span class="flugbahn-einheit">ft</span>
        </div>

        <div id="hoehen-balken" class="flugbahn">

          <!--
            Platzhalter-Tiles.
            0 ft ist die Landung.
          -->

          <div class="hoehen-tile">10.000</div>
          <div class="hoehen-tile">9.000</div>
          <div class="hoehen-tile">8.000</div>
          <div class="hoehen-tile">7.000</div>
          <div class="hoehen-tile">6.000</div>
          <div class="hoehen-tile">5.000</div>
          <div class="hoehen-tile">4.000</div>
          <div class="hoehen-tile">3.000</div>
          <div class="hoehen-tile">2.000</div>
          <div class="hoehen-tile">1.000</div>

          <div class="landungs-tile">
            <span>🛬</span>
          </div>

        </div>

      </div>

    </section>


    <!-- =========================================================
         FORTSCHRITT
         ========================================================= -->

    <section id="fortschritt-leiste">

      <div>
        Fahrwerk:
        <span id="s-fahrwerk" class="lichter"></span>
      </div>

      <div>
        Landeklappen:
        <span id="s-klappen" class="lichter"></span>
      </div>

      <div>
        Bremsen:
        <span id="s-bremsen" class="lichter"></span>
      </div>

    </section>


    <!-- =========================================================
         COCKPIT BOARD
         ========================================================= -->

    <section id="cockpit-board"></section>


    <!-- =========================================================
         SPIELER
         ========================================================= -->

    <section id="spieler-bereiche">

      <div class="spieler-bereich" id="bereich-pilot">

        <h2>
          Pilotin
          <span class="farbe-punkt blau"></span>
        </h2>

        <div class="wuerfel-reihe" id="wuerfel-pilot"></div>

      </div>


      <div class="spieler-bereich" id="bereich-kopilot">

        <h2>
          Co-Pilot
          <span class="farbe-punkt orange"></span>
        </h2>

        <div class="wuerfel-reihe" id="wuerfel-kopilot"></div>

      </div>

    </section>


    <!-- =========================================================
         AKTIONEN
         ========================================================= -->

    <section id="aktionen-leiste">

      <span id="am-zug-anzeige"></span>

      <div class="aktionen-buttons">
        <button id="neuwurf-btn">🔄 Neuwurf</button>
        <button id="rundenende-btn">Runde beenden</button>
      </div>

    </section>


    <section id="neuwurf-panel" class="versteckt"></section>

    <section id="meldung-leiste"></section>

  </main>


  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="js/engine-src.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Service Worker registrieren (PWA-Offline-Support)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(reg => console.log("SW registered:", reg.scope))
        .catch(err => console.warn("SW registration failed:", err));
    }
  </script>

</body>
</html>
