<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Fly Team</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fly Team">
<link rel="apple-touch-icon" href="icons/icon-fly-team-180.png">
<meta name="theme-color" content="#194650">
<link rel="stylesheet" href="css/style.css?v=compact-distance-v2">
<link rel="stylesheet" href="css/landings.css">
<link rel="stylesheet" href="css/modules.css">
<link rel="stylesheet" href="css/reroll.css">
<link rel="stylesheet" href="css/singleplayer.css">
<link rel="stylesheet" href="css/game-dialogs.css">
  <link rel="stylesheet" href="css/game-experience.css">
  <link rel="stylesheet" href="css/cockpit-layout.css">
  <link rel="stylesheet" href="css/round-planning.css">
<style>
  /* ── Startmenü ── */
  #start-menu {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
    padding: calc(2rem + env(safe-area-inset-top)) 2rem calc(2rem + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  #start-menu h1 { margin: 0.3rem 0 0.2rem; font-size: 2rem; }
  #start-menu p  { color: var(--muted); margin: 0; }
  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 1.1rem;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    line-height: 1.5;
  }
  .start-btn span { font-weight: 400; font-size: 0.82rem; display: block; }
</style>
</head>
<body>

  <!-- ═══ 1. STARTMENÜ (immer zuerst sichtbar) ═══ -->
  <div id="start-menu">
    <div style="text-align:center">
      <div style="font-size:3rem">✈</div>
      <h1>Fly Team</h1>
    </div>
    <button id="resume-last-game" class="start-btn" hidden style="background:var(--blau);color:white">Letztes Spiel fortsetzen<span id="resume-last-label"></span></button>
    <button class="start-btn" style="background:var(--blau);color:white"
            onclick="Singleplayer.showMenu()">
      🤖 Singleplayer
      <span>Mit KI fliegen, Feedback geben und Beispiele sammeln</span>
    </button>
    <button class="start-btn" style="background:var(--blau);color:white"
            onclick="startPassAndPlay()">
      👥 Pass &amp; Play
      <span>Zwei Spieler, ein Gerät</span>
    </button>
    <button class="start-btn" style="background:var(--orange);color:white"
            onclick="window.location='multiplayer.html'">
      📱 Multiplayer
      <span>Zwei Geräte, kein Server nötig</span>
    </button>
    <section id="offline-pack" aria-label="Offline spielen">
      <button id="offline-download" class="start-btn" type="button" disabled>Offline-Paket wird geprüft …</button>
      <p id="offline-status" role="status" aria-live="polite"></p>
      <progress id="offline-progress" hidden aria-label="Offline-Download"></progress>
      <small>Auf dem iPhone zuerst zum Home-Bildschirm hinzufügen, dann in der App herunterladen. Beim Download die App geöffnet lassen.</small>
    </section>
    <div class="app-update-check"><button id="app-update-check" type="button">Nach Updates suchen</button><p id="app-update-status" role="status"></p></div>
  </div>

  <section id="singleplayer-menu" class="versteckt" aria-label="Singleplayer"></section>
  <div id="landing-selection" class="versteckt" aria-label="Landung auswählen"></div>

  <!-- ═══ 2. HEADER (versteckt bis Spiel geladen) ═══ -->
  <header id="game-header" class="versteckt">
    <div class="header-flight">
      <h1>✈ Fly Team</h1>
      <div id="flight-summary" class="versteckt"></div>
    </div>
    <div id="spiel-auswahl">
      <button id="round-plan-summary" type="button" hidden>Plan</button>
      <button id="rueckgaengig-btn" aria-label="Rückgängig" title="Letzten Spielschritt rückgängig machen" disabled>↶</button>
      <button id="neues-spiel-btn" hidden>Landung</button>
      <button id="menue-btn" class="menu-btn">☰ Menü</button>
    </div>
  </header>

  <!-- ═══ 3. LADEHINWEIS (sichtbar während Pyodide lädt) ═══ -->
  <div id="lade-hinweis" class="versteckt"
       style="text-align:center;padding:calc(2rem + env(safe-area-inset-top)) 2rem 2rem;color:var(--muted)">
    Python-Engine wird geladen …
  </div>

  <!-- ═══ 4. SPIEL-UI (sichtbar nach dem Laden) ═══ -->
  <main id="spiel-ui" class="versteckt">

    <section id="tracks-leiste">
      <div class="dice-tray pilot" aria-label="Würfel der Pilotin">
        <span class="dice-tray-label">Pilotin</span>
        <div class="wuerfel-reihe" id="wuerfel-pilot"></div>
      </div>
      <div class="vtrack-col">
        <div class="vtrack-wrap">
          <div class="vtrack" id="distance-track" role="group" aria-label="Entfernungsleiste">
            <div class="vtrack-grid"></div>
            <div class="vtrack-fill-remaining" id="distance-fill"></div>
            <div class="vtrack-fill-used" id="distance-used"></div>
            <div id="distance-labels"></div>
            <div id="distance-obstacles"></div>
          </div>
        </div>
      </div>
      <div class="vtrack-col">
        <div class="vtrack-wrap">
          <div class="vtrack" id="altitude-track" role="group" aria-label="Höhenleiste">
            <div class="vtrack-grid"></div>
            <div class="vtrack-fill-remaining" id="altitude-fill"></div>
            <div class="vtrack-fill-used" id="altitude-used"></div>
            <div id="altitude-labels"></div>
            <span class="vtrack-zielicon" id="altitude-landing-icon" title="Landung bei 0 ft">🛬</span>
          </div>
        </div>
      </div>
      <div class="dice-tray kopilot" aria-label="Würfel des Co-Piloten">
        <span class="dice-tray-label">Co-Pilot</span>
        <div class="wuerfel-reihe" id="wuerfel-kopilot"></div>
      </div>
    </section>

    <!-- Cockpit-Board: Pilotin links, Ruder/Aerodynamik/Schub/Bremsen/
         Konzentration in der Mitte, Co-Pilot rechts - wie auf dem
         physischen Panel. -->
    <div class="board-grid">

      <div class="side-col" id="col-pilot">
        <div class="side-block" id="reroll-slot-pilot" title="Neuwurf-Plättchen">
          <span class="side-block-label">Neuwurf</span>
          <span id="s-neuwurf">-</span>
        </div>
        <div id="col-pilot-felder"></div>
        <div class="side-block" id="kaffee-pilot-anzeige" title="Kaffeetassen">
          <span class="side-block-label">☕ Kaffee</span>
          <span id="s-kaffee-status">-</span>
        </div>
      </div>

      <div class="center-col">
        <div class="attitude-gauge-row">
          <div class="ruder-slot-group"><span>Ruder</span><div class="ruder-dice-slot" id="ruder-slot-pilot"></div></div>
          <div class="attitude-gauge" id="attitude-gauge" title="Fluglage">
            <svg viewBox="0 8 100 90" width="100" height="90">
              <clipPath id="attitude-clip"><circle cx="50" cy="60" r="35"/></clipPath>
              <g clip-path="url(#attitude-clip)">
                <rect x="-10" y="-10" width="120" height="70" fill="#5b9bd5"/>
                <rect x="-10" y="60" width="120" height="70" fill="#c9a874"/>
              </g>
              <circle cx="50" cy="60" r="35" fill="none" stroke="#0f172a" stroke-width="3"/>

              <!-- 5 feste Ausrichtungs-Marker: -2, -1, 0, +1, +2 -->
              <g fill="rgba(255,255,255,0.9)" stroke="#0f172a" stroke-width="0.7">
                <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(21,26) rotate(-40)"/>
                <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(35,18) rotate(-20)"/>
                <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(50,15) rotate(0)"/>
                <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(65,18) rotate(20)"/>
                <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(79,26) rotate(40)"/>
              </g>

              <!-- Rotierender Zeiger: dreht sich relativ zum FESTEN Horizont. -->
              <g id="attitude-needle">
                <line x1="30" y1="60" x2="70" y2="60" stroke="white" stroke-width="3"/>
                <polygon points="50,20 43,35 57,35" fill="white" stroke="#0f172a" stroke-width="1"/>
                <circle cx="50" cy="60" r="4.5" fill="white" stroke="#0f172a" stroke-width="1"/>
              </g>
            </svg>
          </div>
          <div class="ruder-slot-group"><span>Ruder</span><div class="ruder-dice-slot" id="ruder-slot-kopilot"></div></div>
        </div>

        <div id="s-aero" class="skala-wrap"></div>

        <div class="thrust-instruments">
          <div class="mitte-reihe schub-reihe" id="schub-reihe"></div>
          <div id="wind-instrument" class="versteckt"></div>
        </div>

        <div id="s-brems" class="skala-wrap"></div>

        <div class="mitte-reihe" id="bremse-reihe"></div>
        <div id="ice-brakes" class="versteckt" aria-label="Eisbremsen"></div>
        <div class="mitte-reihe konzentration-zeile"><div id="konzentration-reihe"></div></div>
      </div>

      <div class="side-col" id="col-kopilot">
        <div id="col-kopilot-felder"></div>
        <div id="fuel-action" class="versteckt"></div>
      </div>

      <aside id="fuel-gauge" class="versteckt" aria-label="Treibstoffvorrat"></aside>
    </div>


    <section id="intern-strip" class="versteckt" aria-label="Praktikantenausbildung"></section>
    <section id="ability-strip" class="versteckt" aria-label="Fähigkeitskarten"></section>

    <section id="aktionen-leiste">
      <span id="s-runde">-</span>
      <span id="am-zug-anzeige"></span>
      <div id="realtime-instrument" class="versteckt"></div>
      <div id="round-ready" class="round-ready" hidden><div class="round-ready-caption"><span aria-hidden="true">✓</span><strong>Alles gesetzt</strong></div><div class="aktionen-buttons">
        <button id="rundenende-btn" disabled>Nächste Runde →</button>
      </div></div>
    </section>

    <section id="verkehr-panel" class="versteckt" aria-label="Schwarze Verkehrswürfel" aria-live="polite"></section>
    <section id="flight-modules" class="versteckt" aria-label="Zusatzmodule und Fähigkeiten"></section>
    <section id="meldung-leiste" role="status" aria-live="polite"></section>
    <section id="ai-feedback" class="versteckt" aria-label="KI-Feedback"></section>
    <section id="ai-session-bar" class="versteckt" aria-label="KI-Protokoll"></section>

  </main>

  <script src="vendor/pyodide/0.26.1/pyodide.js"></script>
  <script src="js/game-schema.js"></script>
  <script src="js/engine-src.js?v=compact-distance-v2"></script>
  <script src="js/traffic.js"></script>
  <script src="js/landing-catalog.js"></script>
  <script src="js/landings.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/reroll.js"></script>
  <script src="js/ai-models.js"></script>
  <script src="js/ai-policy.js"></script>
  <script src="js/cloud-config.js"></script>
  <script src="js/learning-cloud.js"></script>
  <script src="js/feedback-actions.js"></script>
  <script src="js/cockpit-controls.js"></script>
  <script src="js/cockpit-layout.js"></script>
  <script src="js/round-planning.js"></script>
  <script src="js/best-ai.js"></script>
  <script src="js/singleplayer.js"></script>
  <script src="js/game-dialogs.js"></script>
  <script src="js/game-experience.js"></script>
  <script src="js/app.js?v=compact-distance-v2"></script>
  <script src="js/offline-assets.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/app-updates.js"></script>
</body>
</html>
