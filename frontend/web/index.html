<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Cockpit – digitaler Zwilling</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fly Team">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1e293b">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── Startmenü ── */
  #start-menu {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
    padding: calc(2rem + env(safe-area-inset-top)) 2rem calc(2rem + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  #start-menu h1 { margin: 0.3rem 0 0.2rem; font-size: 2rem; }
  #start-menu p  { color: var(--muted); margin: 0; }
  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 1.1rem;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    line-height: 1.5;
  }
  .start-btn span { font-weight: 400; font-size: 0.82rem; display: block; }
</style>
</head>
<body>

  <!-- ═══ 1. STARTMENÜ (immer zuerst sichtbar) ═══ -->
  <div id="start-menu">
    <div style="text-align:center">
      <div style="font-size:3rem">✈</div>
      <h1>Cockpit</h1>
      <p>Digitaler Zwilling</p>
    </div>
    <button class="start-btn" style="background:var(--blau);color:white"
            onclick="startPassAndPlay()">
      👥 Pass &amp; Play
      <span>Zwei Spieler, ein Gerät</span>
    </button>
    <button class="start-btn" style="background:var(--orange);color:white"
            onclick="window.location='multiplayer.html'">
      📱 Multiplayer
      <span>Zwei Geräte, kein Server nötig</span>
    </button>
  </div>

  <!-- ═══ 2. HEADER (versteckt bis Spiel geladen) ═══ -->
  <header id="game-header" class="versteckt">
    <h1>✈ Cockpit <span class="subtitle">digitaler Zwilling</span></h1>
    <div id="spiel-auswahl">
      <label for="flughafen-auswahl">Flughafen:</label>
      <select id="flughafen-auswahl">
        <option value="MUC">MUC – München</option>
      </select>
      <button id="neues-spiel-btn">Neu</button>
      <button id="menue-btn" class="menu-btn">☰ Menü</button>
    </div>
  </header>

  <!-- ═══ 3. LADEHINWEIS (sichtbar während Pyodide lädt) ═══ -->
  <div id="lade-hinweis" class="versteckt"
       style="text-align:center;padding:calc(2rem + env(safe-area-inset-top)) 2rem 2rem;color:var(--muted)">
    Python-Engine wird geladen …
  </div>

  <!-- ═══ 4. SPIEL-UI (sichtbar nach dem Laden) ═══ -->
  <main id="spiel-ui" class="versteckt">

    <section id="status-leiste">
      <div class="status-feld"><span class="label">Runde</span><span id="s-runde">-</span></div>
      <div class="status-feld"><span class="label">Aerodynamik</span><span id="s-aero">-</span></div>
      <div class="status-feld"><span class="label">Bremsen</span><span id="s-brems">-</span></div>
      <div class="status-feld"><span class="label">Neuwurf</span><span id="s-neuwurf">-</span></div>
    </section>

    <div class="cockpit-row">
      <section id="cockpit-board"></section>
      <div class="attitude-col">
        <div class="attitude-gauge" id="attitude-gauge" title="Fluglage">
          <svg viewBox="0 0 100 100" width="108" height="108">
            <clipPath id="attitude-clip"><circle cx="50" cy="60" r="35"/></clipPath>
            <g clip-path="url(#attitude-clip)">
              <rect x="-10" y="-10" width="120" height="70" fill="#5b9bd5"/>
              <rect x="-10" y="60" width="120" height="70" fill="#c9a874"/>
            </g>
            <circle cx="50" cy="60" r="35" fill="none" stroke="#0f172a" stroke-width="3"/>

            <!-- 5 feste Ausrichtungs-Marker: -2, -1, 0, +1, +2 -->
            <g fill="rgba(255,255,255,0.9)" stroke="#0f172a" stroke-width="0.7">
              <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(21,26) rotate(-40)"/>
              <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(35,18) rotate(-20)"/>
              <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(50,15) rotate(0)"/>
              <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(65,18) rotate(20)"/>
              <polygon points="-4.5,-3.5 4.5,-3.5 0,4.5" transform="translate(79,26) rotate(40)"/>
            </g>

            <!-- Rotierender Zeiger: dreht sich relativ zum FESTEN Horizont. -->
            <g id="attitude-needle">
              <line x1="30" y1="60" x2="70" y2="60" stroke="white" stroke-width="3"/>
              <polygon points="50,20 43,35 57,35" fill="white" stroke="#0f172a" stroke-width="1"/>
              <circle cx="50" cy="60" r="4.5" fill="white" stroke="#0f172a" stroke-width="1"/>
            </g>
          </svg>
        </div>
        <div class="vtrack-caption">Fluglage</div>
      </div>
      <section id="tracks-leiste">
        <div class="vtrack-col">
          <div class="vtrack-wrap">
            <div class="vtrack" id="altitude-track">
              <div class="vtrack-grid"></div>
              <div class="vtrack-fill-remaining" id="altitude-fill"></div>
              <div class="vtrack-fill-used" id="altitude-used"></div>
            </div>
          </div>
          <div class="vtrack-caption" id="s-hoehe-label">-</div>
        </div>
        <div class="tracks-marker-col">
          <div class="tracks-marker-row" id="tracks-marker">
            <span class="tracks-marker-line"></span>
            <span class="tracks-marker-plane">✈</span>
            <span class="tracks-marker-line"></span>
          </div>
        </div>
        <div class="vtrack-col">
          <div class="vtrack-wrap">
            <div class="vtrack" id="distance-track">
              <div class="vtrack-grid"></div>
              <div class="vtrack-fill-remaining" id="distance-fill"></div>
              <div class="vtrack-fill-used" id="distance-used"></div>
              <div id="distance-obstacles"></div>
            </div>
          </div>
          <div class="vtrack-caption" id="s-entfernung-label">-</div>
        </div>
      </section>
    </div>

    <section id="spieler-bereiche">
      <div class="spieler-bereich" id="bereich-pilot">
        <h2>Pilotin <span class="farbe-punkt blau"></span></h2>
        <div class="wuerfel-reihe" id="wuerfel-pilot"></div>
      </div>
      <div class="spieler-bereich" id="bereich-kopilot">
        <h2>Co-Pilot <span class="farbe-punkt orange"></span></h2>
        <div class="wuerfel-reihe" id="wuerfel-kopilot"></div>
      </div>
    </section>

    <section id="aktionen-leiste">
      <span id="am-zug-anzeige"></span>
      <div class="aktionen-buttons">
        <button id="neuwurf-btn">🔄</button>
        <button id="rundenende-btn">Runde beenden</button>
      </div>
    </section>

    <section id="neuwurf-panel" class="versteckt"></section>
    <section id="meldung-leiste"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="js/engine-src.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(reg => console.log("SW registered:", reg.scope))
        .catch(err => console.warn("SW registration failed:", err));
    }
  </script>
</body>
</html>
