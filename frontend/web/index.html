<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit – digitaler Zwilling</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS: damit Safari die App wie eine native App öffnet -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Theme-Farbe für die Browser-Titelleiste (Android/Desktop) -->
<meta name="theme-color" content="#1e293b">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>✈ Cockpit <span class="subtitle">digitaler Zwilling</span></h1>
    <div id="spiel-auswahl">
      <label for="flughafen-auswahl">Flughafen:</label>
      <select id="flughafen-auswahl">
        <option value="MUC">MUC – München</option>
      </select>
      <button id="neues-spiel-btn">Neues Spiel</button>
      <a href="multiplayer.html" style="
        background:var(--panel-hell);
        color:var(--text);
        border:1px solid #475569;
        border-radius:10px;
        padding:0.5rem 0.8rem;
        font-size:0.95rem;
        text-decoration:none;
        display:inline-block;">📡 Multiplayer</a>
    </div>
  </header>

  <!-- ========== Startmenü ========== -->
  <div id="start-menu" style="
      position:fixed;inset:0;background:var(--bg);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1.8rem;z-index:100;padding:2rem;">
    <div style="text-align:center">
      <div style="font-size:3rem">✈</div>
      <h1 style="margin:0.3rem 0 0.2rem;font-size:2rem">Cockpit</h1>
      <p style="color:var(--muted);margin:0">Digitaler Zwilling</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem;width:100%;max-width:320px">
      <button onclick="document.getElementById('start-menu').style.display='none';startPassAndPlay()"
              style="padding:1.1rem;font-size:1.1rem;font-weight:700;border-radius:12px;background:var(--blau);color:white;border:none;cursor:pointer">
        👥 Pass &amp; Play<br>
        <span style="font-weight:400;font-size:0.8rem">Zwei Spieler, ein Gerät</span>
      </button>
      <button onclick="window.location='multiplayer.html'"
              style="padding:1.1rem;font-size:1.1rem;font-weight:700;border-radius:12px;background:var(--orange);color:white;border:none;cursor:pointer">
        📱 Multiplayer<br>
        <span style="font-weight:400;font-size:0.8rem">Zwei Geräte, kein Server nötig</span>
      </button>
    </div>
  </div>



  <main id="spiel-ui" class="versteckt">

    <section id="status-leiste">
      <div class="status-feld"><span class="label">Runde</span><span id="s-runde">-</span></div>
      <div class="status-feld"><span class="label">Höhe</span><span id="s-hoehe">-</span> ft</div>
      <div class="status-feld"><span class="label">Entfernung</span><span id="s-entfernung">-</span></div>
      <div class="status-feld"><span class="label">Fluglage</span><span id="s-fluglage">-</span></div>
      <div class="status-feld"><span class="label">Aerodynamik</span><span id="s-aero">-</span></div>
      <div class="status-feld"><span class="label">Bremsen-Marker</span><span id="s-brems">-</span></div>
      <div class="status-feld"><span class="label">Kaffee</span><span id="s-kaffee">-</span></div>
      <div class="status-feld"><span class="label">Neuwurf</span><span id="s-neuwurf">-</span></div>
    </section>

    <section id="fortschritt-leiste">
      <div>Fahrwerk: <span id="s-fahrwerk" class="lichter"></span></div>
      <div>Landeklappen: <span id="s-klappen" class="lichter"></span></div>
      <div>Bremsen: <span id="s-bremsen" class="lichter"></span></div>
    </section>

    <section id="flugzeuge-leiste">
      <span class="label">Flugzeuge auf der Entfernungsleiste:</span>
      <span id="s-flugzeuge"></span>
    </section>

    <section id="cockpit-board"></section>

    <section id="spieler-bereiche">
      <div class="spieler-bereich" id="bereich-pilot">
        <h2>Pilotin <span class="farbe-punkt blau"></span></h2>
        <div class="wuerfel-reihe" id="wuerfel-pilot"></div>
      </div>
      <div class="spieler-bereich" id="bereich-kopilot">
        <h2>Co-Pilot <span class="farbe-punkt orange"></span></h2>
        <div class="wuerfel-reihe" id="wuerfel-kopilot"></div>
      </div>
    </section>

    <section id="aktionen-leiste">
      <span id="am-zug-anzeige"></span>
      <div class="aktionen-buttons">
        <button id="neuwurf-btn">🔄 Neuwurf</button>
        <button id="rundenende-btn">Runde beenden</button>
      </div>
    </section>

    <section id="neuwurf-panel" class="versteckt"></section>

    <section id="meldung-leiste"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="js/engine-src.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Service Worker registrieren (PWA-Offline-Support)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(reg => console.log("SW registered:", reg.scope))
        .catch(err => console.warn("SW registration failed:", err));
    }
  </script>
</body>
</html>
