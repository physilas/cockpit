<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit – digitaler Zwilling</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fly Team">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1e293b">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── Startmenü ── */
  #start-menu {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.8rem;
    padding: 2rem;
    background: var(--bg);
  }
  #start-menu h1 { margin: 0.3rem 0 0.2rem; font-size: 2rem; }
  #start-menu p  { color: var(--muted); margin: 0; }
  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 1.1rem;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    line-height: 1.5;
  }
  .start-btn span { font-weight: 400; font-size: 0.82rem; display: block; }
</style>
</head>
<body>

  <!-- ═══ 1. STARTMENÜ (immer zuerst sichtbar) ═══ -->
  <div id="start-menu">
    <div style="text-align:center">
      <div style="font-size:3rem">✈</div>
      <h1>Cockpit</h1>
      <p>Digitaler Zwilling</p>
    </div>
    <button class="start-btn" style="background:var(--blau);color:white"
            onclick="startPassAndPlay()">
      👥 Pass &amp; Play
      <span>Zwei Spieler, ein Gerät</span>
    </button>
    <button class="start-btn" style="background:var(--orange);color:white"
            onclick="window.location='multiplayer.html'">
      📱 Multiplayer
      <span>Zwei Geräte, kein Server nötig</span>
    </button>
  </div>

  <!-- ═══ 2. HEADER (versteckt bis Spiel geladen) ═══ -->
  <header id="game-header" class="versteckt">
    <h1>✈ Cockpit <span class="subtitle">digitaler Zwilling</span></h1>
    <div id="spiel-auswahl">
      <label for="flughafen-auswahl">Flughafen:</label>
      <select id="flughafen-auswahl">
        <option value="MUC">MUC – München</option>
      </select>
      <button id="neues-spiel-btn">Neues Spiel</button>
      <a href="multiplayer.html" style="
          background:var(--panel-hell);color:var(--text);
          border:1px solid #475569;border-radius:10px;
          padding:0.5rem 0.8rem;font-size:0.95rem;
          text-decoration:none;display:inline-block;">
        📡 Multiplayer
      </a>
    </div>
  </header>

  <!-- ═══ 3. LADEHINWEIS (sichtbar während Pyodide lädt) ═══ -->
  <div id="lade-hinweis" class="versteckt"
       style="text-align:center;padding:3rem;color:var(--muted)">
    Python-Engine wird geladen …
  </div>

  <!-- ═══ 4. SPIEL-UI (sichtbar nach dem Laden) ═══ -->
  <main id="spiel-ui" class="versteckt">

    <section id="status-leiste">
      <div class="status-feld"><span class="label">Runde</span><span id="s-runde">-</span></div>
      <div class="status-feld"><span class="label">Höhe</span><span id="s-hoehe">-</span> ft</div>
      <div class="status-feld"><span class="label">Entfernung</span><span id="s-entfernung">-</span></div>
      <div class="status-feld"><span class="label">Fluglage</span><span id="s-fluglage">-</span></div>
      <div class="status-feld"><span class="label">Aerodynamik</span><span id="s-aero">-</span></div>
      <div class="status-feld"><span class="label">Bremsen-Marker</span><span id="s-brems">-</span></div>
      <div class="status-feld"><span class="label">Kaffee</span><span id="s-kaffee">-</span></div>
      <div class="status-feld"><span class="label">Neuwurf</span><span id="s-neuwurf">-</span></div>
    </section>

    <section id="fortschritt-leiste">
      <div>Fahrwerk: <span id="s-fahrwerk" class="lichter"></span></div>
      <div>Landeklappen: <span id="s-klappen" class="lichter"></span></div>
      <div>Bremsen: <span id="s-bremsen" class="lichter"></span></div>
    </section>

    <section id="flugzeuge-leiste">
      <span class="label">Flugzeuge auf der Entfernungsleiste:</span>
      <span id="s-flugzeuge"></span>
    </section>

    <section id="cockpit-board"></section>

    <section id="spieler-bereiche">
      <div class="spieler-bereich" id="bereich-pilot">
        <h2>Pilotin <span class="farbe-punkt blau"></span></h2>
        <div class="wuerfel-reihe" id="wuerfel-pilot"></div>
      </div>
      <div class="spieler-bereich" id="bereich-kopilot">
        <h2>Co-Pilot <span class="farbe-punkt orange"></span></h2>
        <div class="wuerfel-reihe" id="wuerfel-kopilot"></div>
      </div>
    </section>

    <section id="aktionen-leiste">
      <span id="am-zug-anzeige"></span>
      <div class="aktionen-buttons">
        <button id="neuwurf-btn">🔄 Neuwurf</button>
        <button id="rundenende-btn">Runde beenden</button>
      </div>
    </section>

    <section id="neuwurf-panel" class="versteckt"></section>
    <section id="meldung-leiste"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="js/engine-src.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(reg => console.log("SW registered:", reg.scope))
        .catch(err => console.warn("SW registration failed:", err));
    }
  </script>
</body>
</html>
