<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verkehrswürfel – UI-Regressionstests</title>
<link rel="stylesheet" href="../frontend/web/css/style.css">
<style>
  body { padding: 16px; }
  #fixture { position: relative; height: 300px; }
  #distance-track { position: relative; width: 90px; height: 252px; }
  .board-grid { min-height: 50px; }
  #test-results { white-space: pre-wrap; }
</style>
<header id="game-header"><h1>Verkehrswürfel: UI-Tests</h1></header>
<button id="run-tests" type="button">UI-Tests starten</button>
<pre id="test-results" role="status">Noch nicht gestartet.</pre>
<div id="fixture">
  <div id="distance-track"><div id="distance-obstacles"></div></div>
  <div class="dice-tray"><button class="view-btn">Spielerwürfel</button></div>
  <div class="board-grid"><button>Cockpit</button></div>
  <div id="aktionen-leiste"><button id="rundenende-btn">Runde beenden</button></div>
  <div id="neuwurf-panel"></div>
  <section id="verkehr-panel" class="versteckt"></section>
</div>
<script src="../frontend/web/js/traffic.js"></script>
<script src="traffic-ui.js"></script>
</html>
